# (Tuỳ chọn) Giữ project Supabase gói Free không bị tạm dừng vì "không hoạt động".
# Cần 2 repository secrets: SUPABASE_URL và SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions).
# Lưu ý: GitHub có thể tự tắt workflow theo lịch nếu repo 60 ngày không có commit — xem SETUP-GUESTBOOK.md.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 3 */3 * *"   # 03:17 UTC, mỗi 3 ngày
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Truy vấn nhẹ vào bảng guestbook
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Chưa cấu hình secrets — bỏ qua."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL%/}/rest/v1/guestbook_entries?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          test "$code" = "200"
